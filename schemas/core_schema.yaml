id: https://brain-connects.org/ic3-core-schema
name: core_schema
description: Core data entities (datasets and items).
imports:
  - base_schema
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  cc: https://brain-connects.org/cc/
default_prefix: cc

classes:
  DataSet:
    description: A collection of DataItems (e.g., all neurons from a study, all barcoded detections in a volume).
    slots:
      - id
      - name
      - publication
      - modality
      - default_reference_space
      - default_embedding_space
    mixins:
      - ProjectScoped
  ReferenceSpaceReference:
    description: >-
      An embedded reference to a ReferenceSpace by its exact (project_id, id)
      identity. A null or omitted project_id selects the global scope, not the
      dataset's project; no fallback between scopes is implied.
    slots:
      - project_id
      - id
    slot_usage:
      project_id:
        required: false
      id:
        required: true
        description: Identifier of the ReferenceSpace in the selected scope.
  DataItem:
    description: An individual datum (e.g., neuron reconstruction, barcoded detection, injection experiment).
    slots:
      - id
      - name
      - neuroglancer_link
    mixins:
      - ProjectScoped
    slot_usage:
      neuroglancer_link:
        description: A link that illustrates this data item visualized in a common coordinate framework in neuroglancer. 
        range: string
        multivalued: false
        required: false
  DataItemDataSetAssociation:
    description: Many-to-many link between DataItem and DataSet.
    mixins:
      - ProjectScoped
    slots:
      - dataitem_id  
      - dataset_id
    slot_usage:
      dataitem_id:
        range: DataItem  # store identifier value
        required: true
        description: Identifier of the DataItem you are linking
      dataset_id:
        range: DataSet  # store identifier value
        required: true
        description: Identifier of the DataSet you are linking
    
slots:
  default_reference_space:
    range: ReferenceSpaceReference
    inlined: true
    required: false
    description: >-
      Optional recommended initial spatial space for this dataset. Null means
      no recommendation, not that spatial views should be hidden. The referenced
      space should have coordinates for dataset members; complete coverage is
      not required. Screen orientation is defined by the space's default_2d_view.
  default_embedding_space:
    range: string
    required: false
    description: >-
      Optional identifier of the recommended initial EmbeddingSpace in this
      dataset's project. Null means no recommendation, not that embedding views
      should be hidden. The referenced space should have coordinates for dataset
      members; complete coverage is not required. Screen orientation is defined
      by the space's default_2d_view.
  dataitem_id:
    range: DataItem
  dataset_id:
    description: Identifier of the DataSet (string key). If a DataSet class is referenced this slot holds its id.
    range: DataSet
    required: true
