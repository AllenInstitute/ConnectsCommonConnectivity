id: https://brain-connects.org/ic3-mappings-schema
name: mappings_schema
description: Schema for mapping results across datasets (cell→cell, cell→cluster, cluster→cluster).
imports:
  - base_schema
  - core_schema
  - clustering_schema
prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  cc: https://brain-connects.org/cc/
default_prefix: cc

classes:
  MappingSet:
    description: |-
      A coherent set of mappings produced by a specific method.
      The source and target endpoints can be either a DataSet (a cohort of cells) or a
      ClusterHierarchy (a global taxonomy), depending on the mapping kind.
      LinkML cannot enforce "exactly one of {source_dataset, source_hierarchy}" or the
      same for target, so the choice is left to per-mapping conventions:
        - CellToCellMapping     : source_dataset    + target_dataset
        - CellToClusterMapping  : source_dataset    + target_hierarchy
        - ClusterToClusterMapping: source_hierarchy + target_hierarchy
      At least one source field and one target field must be populated; consumers should
      fail loudly if both source fields (or both target fields) are populated or empty.
    slots:
      - id
      - name
      - description
      - method_name
      - method_version
      - author
      - created_at
      - source_dataset
      - target_dataset
      - source_hierarchy
      - target_hierarchy
      - json_object
    mixins:
      - ProjectScoped
    slot_usage:
      name:
        range: string
      description:
        range: string
      method_name:
        range: string
        required: true
      method_version:
        range: string
      author:
        range: string
      created_at:
        range: datetime
      source_dataset:
        range: DataSet
        inlined: false
        description: Dataset providing the source entities. Populate for CellToCellMapping and CellToClusterMapping.
      target_dataset:
        range: DataSet
        inlined: false
        description: Dataset providing the target entities. Populate for CellToCellMapping.
      source_hierarchy:
        range: ClusterHierarchy
        inlined: false
        description: ClusterHierarchy providing the source entities. Populate for ClusterToClusterMapping.
      target_hierarchy:
        range: ClusterHierarchy
        inlined: false
        description: ClusterHierarchy providing the target entities. Populate for CellToClusterMapping and ClusterToClusterMapping.
      json_object:
        description: Arbitrary method parameters (JSON string).

  CellToCellMapping:
    description: Mapping between a source cell and a target cell, with scores/probabilities.
    slots:
      - id
      - mapping_set
      - source_cell
      - target_cell
      - score
      - probability
      - notes
    mixins:
      - ProjectScoped
    slot_usage:
      mapping_set:
        range: MappingSet
        required: true
      source_cell:
        range: DataItem
        required: true
      target_cell:
        range: DataItem
        required: true
      score:
        range: float
        description: Confidence or similarity score (algorithm-defined).
      probability:
        description: Normalized probability (0..1) when applicable.
      notes:
        range: string

  CellToClusterMapping:
    description: |-
      Mapping between a source cell and a target cluster, with scores/probabilities.
      The associated MappingSet should have source_dataset (cohort of source cells) and
      target_hierarchy (taxonomy whose clusters are mapped to) populated; target_dataset
      and source_hierarchy should be left empty.
    slots:
      - id
      - mapping_set
      - source_cell
      - target_cluster
      - score
      - probability
      - notes
    mixins:
      - ProjectScoped
    slot_usage:
      mapping_set:
        range: MappingSet
        required: true
      source_cell:
        range: DataItem
        required: true
      target_cluster:
        range: Cluster
        required: true
      score:
        range: float
      notes:
        range: string

  ClusterToClusterMapping:
    description: |-
      Mapping between a source cluster and a target cluster, with scores/probabilities.
      The associated MappingSet should have source_hierarchy and target_hierarchy
      populated; source_dataset and target_dataset should be left empty.
    slots:
      - id
      - mapping_set
      - source_cluster
      - target_cluster
      - score
      - probability
      - notes
    mixins:
      - ProjectScoped
    slot_usage:
      mapping_set:
        range: MappingSet
        required: true
      source_cluster:
        range: Cluster
        required: true
      target_cluster:
        range: Cluster
        required: true
      score:
        range: float
      notes:
        range: string

slots:
  mapping_set:
    description: The mapping set this entry belongs to.
  source_cell:
    description: Source cell (DataItem) in the mapping.
  target_cell:
    description: Target cell (DataItem) in the mapping.
  source_cluster:
    description: Source cluster in the mapping.
  target_cluster:
    description: Target cluster in the mapping.
  source_dataset:
    description: Dataset providing the source entities (for cell-sourced mappings).
    range: DataSet
    inlined: false
  target_dataset:
    description: Dataset providing the target entities (for cell-targeted mappings).
    range: DataSet
    inlined: false
  source_hierarchy:
    description: ClusterHierarchy providing the source entities (for cluster-sourced mappings).
    range: ClusterHierarchy
    inlined: false
  target_hierarchy:
    description: ClusterHierarchy providing the target entities (for cluster-targeted mappings).
    range: ClusterHierarchy
    inlined: false
  method_name:
    description: Name of the mapping method.
  method_version:
    description: Version of the mapping method.
  author:
    description: Author or organization who produced this mapping.
  created_at:
    description: Timestamp when the mapping set was created.
  notes:
    description: Free-text notes about this mapping entry.
