id: https://brain-connects.org/ic3-spatial-schema
name: spatial_schema
description: Spatial reference spaces, default views, and DataItem coordinates.
imports:
  - base_schema
  - core_schema
prefixes:
  linkml: https://w3id.org/linkml/
  cc: https://brain-connects.org/cc/
default_prefix: cc

enums:
  SignedAxis:
    description: A data axis together with the sense in which it is traversed.
    permissible_values:
      PLUS_X:
        description: Direction of increasing X coordinates.
      MINUS_X:
        description: Direction of decreasing X coordinates.
      PLUS_Y:
        description: Direction of increasing Y coordinates.
      MINUS_Y:
        description: Direction of decreasing Y coordinates.
      PLUS_Z:
        description: Direction of increasing Z coordinates.
      MINUS_Z:
        description: Direction of decreasing Z coordinates.
  
  LocationType:
    description: The anatomical point represented by a coordinate row.
    permissible_values:
      SOMA:
        description: Location of the cell soma.
      CENTROID:
        description: Geometric centroid of the represented structure.
      INJECTION_SITE:
        description: Location of the injection site.
      OTHER:
        description: Another anatomical point; specify its type in SpatialLocation.description.

classes:
  ReferenceSpace:
    description: >-
      A coordinate frame and version identified by (project_id, id). A null project_id
      denotes the global scope; otherwise the space belongs to that project. The same
      id may occur independently in different scopes. Unit applies
      to all coordinate axes; record axis meanings in anatomical_orientation. For voxel
      coordinates, specify voxel_size and voxel_size_unit to describe physical
      scale. Omitted unit, voxel size, or orientation means unspecified, not an
      implicit default. Different frames or versions within a project scope need distinct ids.
    mixins:
      - ProjectScoped
    slots:
      - id
      - name
      - description
      - unit
      - voxel_size
      - voxel_size_unit
      - default_2d_view
      - anatomical_orientation
    slot_usage:
      id:
        required: true
      name:
        required: false
      project_id:
        required: false
      unit:
        required: false
        description: >-
          Unit shared by x, y, and z coordinates in this reference space. Use
          VOXELS for voxel indices, or NANOMETERS_LENGTH, MICRONS_LENGTH,
          MILLIMETERS_LENGTH, or CENTIMETERS_LENGTH for physical coordinates.
    unique_keys:
      reference_space_identity:
        unique_key_slots:
          - project_id
          - id

  Default2DView:
    description: >-
      Embedded default screen layout. The two signed axes must use different
      underlying data axes; the unused axis is depth. Negate MINUS axes to display.
    slots:
      - left_to_right
      - bottom_to_top
    slot_usage:
      left_to_right:
        required: true
      bottom_to_top:
        required: true

  AnatomicalOrientation:
    description: >-
      Embedded anatomical meaning of the coordinate axes. Each slot names the
      signed data axis pointing toward the second-named pole, so a MINUS axis
      points along decreasing coordinates. Every slot is optional and at least
      one must be supplied at write time; leave anatomical_orientation null when
      the frame defines none. Several directions may name the same data axis,
      because terms such as dorsal/ventral, superior/inferior, and cortical depth
      coincide in some frames and not in others. 
    slots:
      - anterior_to_posterior
      - rostral_to_caudal
      - superior_to_inferior
      - dorsal_to_ventral
      - subject_left_to_right
      - medial_to_lateral
      - pia_to_white_matter

  SpatialLocation:
    description: >-
      One anatomical point for a DataItem in a reference space. Within a project,
      each DataItem has at most one row per reference space and location type.
      Coordinates use the reference space's unit and are stored without implicit
      unit conversion or transformation.
    mixins:
      - ProjectScoped
    slots:
      - dataitem_id
      - reference_space
      - location_type
      - description
      - x
      - y
      - z
    slot_usage:
      dataitem_id:
        required: true
      reference_space:
        required: true
      location_type:
        required: true
      description:
        description: Details of the anatomical point, particularly when location_type is OTHER.
      x:
        required: true
      y:
        required: true
      z:
        required: true
    unique_keys:
      location_identity:
        unique_key_slots:
          - project_id
          - dataitem_id
          - reference_space
          - location_type

slots:
  voxel_size:
    range: float
    multivalued: true
    list_elements_ordered: true
    minimum_cardinality: 3
    maximum_cardinality: 3
    description: >-
      Physical voxel dimensions as an ordered (x, y, z) triple in voxel_size_unit.
      Omit when physical scale is unspecified. At write time, a supplied value
      requires reference space unit VOXELS and a voxel_size_unit; each dimension
      must be finite and strictly positive. Unequal dimensions describe
      anisotropic voxels.
  voxel_size_unit:
    range: Unit
    description: >-
      Physical length unit shared by all three voxel_size dimensions.
      At write time, voxel_size and voxel_size_unit must either both be omitted
      or both be supplied. A supplied unit must be NANOMETERS_LENGTH,
      MICRONS_LENGTH, MILLIMETERS_LENGTH, or CENTIMETERS_LENGTH, not VOXELS.
  x:
    range: float
    description: X coordinate in the reference space.
  y:
    range: float
    description: Y coordinate in the reference space.
  z:
    range: float
    description: Z coordinate in the reference space.
  reference_space:
    range: ReferenceSpace
    description: >-
      Identifier of the coordinate frame and version, unique within the selected
      project or global scope.
  location_type:
    range: LocationType
    description: Anatomical point represented by these coordinates.
  default_2d_view:
    range: Default2DView
    inlined: true
    description: Optional screen layout; null means the consumer chooses the view.
  left_to_right:
    range: SignedAxis
    description: Signed data axis pointing from screen left to screen right.
  bottom_to_top:
    range: SignedAxis
    description: Signed data axis pointing from screen bottom to screen top.
  anatomical_orientation:
    range: AnatomicalOrientation
    inlined: true
    description: >-
      Optional anatomical meaning of the data axes.
  anterior_to_posterior:
    range: SignedAxis
    description: Signed data axis pointing toward the posterior pole.
  rostral_to_caudal:
    range: SignedAxis
    description: Signed data axis pointing toward the caudal pole.
  superior_to_inferior:
    range: SignedAxis
    description: Signed data axis pointing toward the inferior side.
  dorsal_to_ventral:
    range: SignedAxis
    description: Signed data axis pointing toward the ventral side.
  subject_left_to_right:
    range: SignedAxis
    description: >-
      Signed data axis pointing toward the subject's right, which is unrelated to
      the screen left_to_right direction of Default2DView.
  medial_to_lateral:
    range: SignedAxis
    description: >-
      Signed data axis pointing away from the midline. Well defined only for
      single-hemisphere or flattened frames, because the lateral direction
      otherwise differs between hemispheres.
  pia_to_white_matter:
    range: SignedAxis
    description: >-
      Signed data axis pointing from the pia toward white matter, for uprighted
      or flattened cortical frames.